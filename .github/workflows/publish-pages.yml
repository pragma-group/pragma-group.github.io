# Publishes the site via GitHub Actions (Settings → Pages → Source: GitHub Actions).
# Sequences after Inject PRAGMA Column: CSV-only merges skip this workflow on push and
# deploy only after inject completes (workflow_run). Other pushes to main deploy here directly.
name: Pages Build and Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pragma/pragma-outputs.csv'
  workflow_run:
    workflows:
      - 'Inject PRAGMA Column'
    types:
      - completed
    branches:
      - main

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
